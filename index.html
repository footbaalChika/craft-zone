<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Champions League - Penalty Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    
    <div class="ui-panel">
        <div id="message">Vyberte cíl a střílejte!</div>
    </div>

    <img src="goalkeeper_center.png" id="goalkeeper" alt="Goalkeeper">
    
    <div class="target-zone">
        <div class="target up-left" data-target="up_left"></div>
        <div class="target up-center" data-target="up_center"></div>
        <div class="target up-right" data-target="up_right"></div>
        <div class="target down-left" data-target="down_left"></div>
        <div class="target down-center" data-target="down_center"></div>
        <div class="target down-right" data-target="down_right"></div>
    </div>

    <img src="sparta_stand.png" id="kicker" class="kicker-stand" alt="Kicker">
    <img src="ball.png" id="ball" alt="Ball">

    <div class="overlay" id="start-screen">
        <div class="modal">
            <h1>ZA KOHO HRÁTE?</h1>
            <p>Vyberte svůj tým a vstřelte gól!</p>
            <div class="team-cards">
                <div class="team-card" onclick="startGame('sparta')">
                    <img src="sparta_logo.png" class="team-logo" alt="Sparta">
                    <h2>Sparta</h2>
                </div>
                <div class="team-card" onclick="startGame('slavia')">
                    <img src="slavia_logo.png" class="team-logo" alt="Slavia">
                    <h2>Slavia</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- ФІНАЛЬНЕ ВІКНО З КНОПКОЮ -->
    <div id="final-screen" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h1 style="color: #ffffff; font-family: sans-serif; margin-bottom: 10px;">Skvělá trefa! 🎯</h1>
        <p style="color: #cccccc; font-family: sans-serif; font-size: 18px; margin-bottom: 30px;">Vyzvedni si svůj bonus za výhru</p>
        <a href="https://click.mytraffgun.com/click?pid=695&offer_id=1002" style="display: inline-block; padding: 15px 40px; background: #d3f522; color: #000; font-size: 22px; font-weight: bold; text-decoration: none; border-radius: 10px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(211, 245, 34, 0.4);">ZÍSKAT BONUS</a>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
