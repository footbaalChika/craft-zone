<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Champions League - Penalty Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    
    <div class="ui-panel">
        <div class="scoreboard">
            <div>PSG: <span class="score-val" id="score-psg">0</span></div>
            <div>Arsenal: <span class="score-val" id="score-arsenal">0</span></div>
        </div>
        <div id="message">Vyberte cíl a střílejte!</div>
    </div>

    <img src="goalkeeper_center.png" id="goalkeeper" alt="Goalkeeper">
    
    <div class="target-zone">
        <div class="target up-left" data-target="up_left"></div>
        <div class="target up-center" data-target="up_center"></div>
        <div class="target up-right" data-target="up_right"></div>
        <div class="target down-left" data-target="down_left"></div>
        <div class="target down-center" data-target="down_center"></div>
        <div class="target down-right" data-target="down_right"></div>
    </div>

    <img src="dembele_stand.png" id="kicker" class="kicker-stand" alt="Kicker">
    <img src="ball.png" id="ball" alt="Ball">

    <div class="overlay" id="start-screen">
        <div class="modal">
            <h1>ZA KOHO HRÁTE?</h1>
            <p>Vyberte svůj tým a střílejte penalty!</p>
            <div class="team-cards">
                <div class="team-card" onclick="startGame('dembele')">
                    <img src="psg_logo.png" class="team-logo" alt="PSG">
                    <h2>PSG</h2>
                </div>
                <div class="team-card" onclick="startGame('rice')">
                    <img src="arsenal_logo.png" class="team-logo arsenal-fix" alt="Arsenal">
                    <h2>Arsenal</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="end-screen" style="display: none;">
        <div class="modal">
            <h1>ČEKÁ NA VÁS VÁŠ BONUS! CZ</h1>
            <p>Získejte <b>50 zatočení zdarma</b> za ověření účtu a k tomu <b>bezplatnou sázku</b> jako bonus k registraci!</p>
            <a href="https://ТВОЄ_ПОСИЛАННЯ_НА_КАЗИНО.com" class="bonus-btn">ZÍSKAT BONUS</a>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
